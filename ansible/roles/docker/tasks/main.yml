---
- name: Download the Docker repository signing key
  ansible.builtin.get_url:
    url: "{{ docker_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  register: docker_key
  retries: 3
  delay: 10
  until: docker_key is succeeded

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] {{ docker_repo_url }} {{ ansible_facts['distribution_release'] }} stable"
    filename: docker
    state: present

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  register: docker_install
  retries: 3
  delay: 10
  until: docker_install is succeeded

- name: Enable and start Docker (systemd hosts)
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when: ansible_facts['service_mgr'] == "systemd"

- name: Report when the Docker daemon is not started
  ansible.builtin.debug:
    msg: "No systemd on this host: Docker is installed but the daemon is not started."
  when: ansible_facts['service_mgr'] != "systemd"
