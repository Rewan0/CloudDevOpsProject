apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-service
  namespace: ivolve
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: ivolve
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: roadmap-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roadmap-service
        app.kubernetes.io/part-of: ivolve
    spec:
      containers:
        - name: roadmap-service
          image: 000000000000.dkr.ecr.us-east-1.localhost:4566/ivolve/roadmap-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: roadmap-service
  namespace: ivolve
  labels:
    app.kubernetes.io/name: roadmap-service
    app.kubernetes.io/part-of: ivolve
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: roadmap-service
  ports:
    - name: http
      port: 8080
      targetPort: http
