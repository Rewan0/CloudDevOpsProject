# Development values only. In a real environment these come from a secret
# manager (Sealed Secrets, External Secrets or SOPS), never from Git.
apiVersion: v1
kind: Secret
metadata:
  name: ivolve-secret
  namespace: ivolve
  labels:
    app.kubernetes.io/part-of: ivolve
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: dev-root-change-me
  MYSQL_USER: ivolve_user
  MYSQL_PASSWORD: dev-user-change-me
  SESSION_SECRET: dev-session-change-me
