apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: ivolve
  labels:
    app.kubernetes.io/part-of: ivolve
spec:
  ingressClassName: traefik
  rules:
    - host: ivolve.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
