apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ivolve
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: ivolve
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: ivolve
    spec:
      containers:
        - name: frontend
          image: 000000000000.dkr.ecr.us-east-1.localhost:4566/ivolve/frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ivolve-config
                  key: AUTH_SERVICE_URL
            - name: ROADMAP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ivolve-config
                  key: ROADMAP_SERVICE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ivolve-secret
                  key: SESSION_SECRET
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ivolve
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: ivolve
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
